name: Build Forge 1.12.2 mods

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Install Gradle 4.10.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle clean build --stacktrace 2>&1 | tee gradle-build.log
      - name: Upload compiled JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: forge-1.12.2-mods
          path: |
            reconnectiblechains/build/libs/*.jar
            ziplines/build/libs/*.jar
      - name: Upload compilation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log
          path: gradle-build.log
          if-no-files-found: warn
