buildscript {
    repositories {
        maven {
            url = 'https://maven.minecraftforge.net'
        }
        mavenCentral()
    }

    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}

allprojects {
    group = 'dev.rezipped.backport'
    version = '0.1.0-alpha'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'net.minecraftforge.gradle'

    sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

    minecraft {
        mappings channel: 'stable', version: '39-1.12'
    }

    dependencies {
        minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
    }

    jar {
        manifest {
            attributes([
                'Specification-Title': project.name,
                'Specification-Vendor': 'rezipped-backport',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'rezipped-backport',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
            ])
        }
    }

    jar.finalizedBy('reobfJar')
}

project(':reconnectiblechains') {
    archivesBaseName = 'reconnectiblechains-forge-1.12.2'

    processResources {
        inputs.property 'version', project.version
        inputs.property 'mcversion', '1.12.2'

        from(sourceSets.main.resources.srcDirs) {
            include 'mcmod.info'
            expand 'version': project.version, 'mcversion': '1.12.2'
        }

        from(sourceSets.main.resources.srcDirs) {
            exclude 'mcmod.info'
        }
    }
}

project(':ziplines') {
    archivesBaseName = 'zipline-forge-1.12.2'

    dependencies {
        compile project(':reconnectiblechains')
    }

    processResources {
        inputs.property 'version', project.version
        inputs.property 'mcversion', '1.12.2'

        from(sourceSets.main.resources.srcDirs) {
            include 'mcmod.info'
            expand 'version': project.version, 'mcversion': '1.12.2'
        }

        from(sourceSets.main.resources.srcDirs) {
            exclude 'mcmod.info'
        }
    }
}
